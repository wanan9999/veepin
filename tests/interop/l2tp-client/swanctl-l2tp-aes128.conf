# Match TunnelForge's accepted AES suite; omit "default" so strongSwan cannot
# silently negotiate the old AES-256 path. Fixtures are synthetic test secrets.
connections {
    l2tp {
        version = 1
        remote_addrs = veepin-l2tp-server
        proposals = aes128-sha1-modp2048
        encap = yes
        # Finite IKE lifetime: exercise strict offer preservation against the
        # server's shorter local policy, not strongSwan's zero-lifetime mode.
        rekey_time = 8h
        local {
            auth = psk
        }
        remote {
            auth = psk
            id = %any
        }
        children {
            l2tp {
                mode = transport
                esp_proposals = aes128-sha1
                # Offer ESP+IPComp OR standalone ESP. The server must skip the
                # entire unsupported bundle and select the second proposal.
                ipcomp = yes
                local_ts = dynamic[udp/l2tp]
                remote_ts = dynamic[udp/l2tp]
                rekey_time = 7h
                life_time = 8h
            }
        }
    }
}

secrets {
    ike-l2tp {
        secret = "l2tpsecret"
    }
}
